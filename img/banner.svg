  <text x="668" y="82" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#6e7681">THE GATE — applied before severity</text>

  <rect x="668" y="96" width="96" height="30" rx="6" fill="#0d2818" stroke="#3fb950" stroke-width="1.5"/>
