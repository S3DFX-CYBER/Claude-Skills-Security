  <text x="428" y="202" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#6e7681">SECRETS</text>

  <text x="64" y="238" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#6e7681">12 labelled evals · 3 worked examples · plain markdown</text>

