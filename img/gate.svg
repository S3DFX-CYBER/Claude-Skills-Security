<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="Flow: artifact, classify track, confidence gate, three outcomes, blind spots on every report">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#484f58"/>
    </marker>
  </defs>

  <rect width="1200" height="520" fill="#0b0f14"/>

  <text x="40" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#e6edf3">How the gate works</text>
  <text x="40" y="68" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#6e7681">Confidence is decided first. Severity is assigned only to what survives.</text>

  <rect x="40" y="200" width="200" height="120" rx="8" fill="#0f1620" stroke="#263140" stroke-width="1.5"/>
  <text x="60" y="230" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#c9d1d9">ARTIFACT</text>
  <text x="60" y="256" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8b949e">workflow · source file</text>
  <text x="60" y="276" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8b949e">CVE · Dockerfile · .env</text>
  <text x="60" y="296" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8b949e">prompt · RAG pipeline</text>

  <line x1="240" y1="260" x2="286" y2="260" stroke="#484f58" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="290" y="200" width="200" height="120" rx="8" fill="#0f1620" stroke="#263140" stroke-width="1.5"/>
  <text x="310" y="230" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#c9d1d9">CLASSIFY</text>
  <text x="310" y="256" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8b949e">tracks A–F</text>
  <text x="310" y="276" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8b949e">all that apply,</text>
  <text x="310" y="296" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8b949e">never just one</text>

  <line x1="490" y1="260" x2="536" y2="260" stroke="#484f58" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="540" y="180" width="160" height="160" rx="8" fill="#0d1621" stroke="#58a6ff" stroke-width="2"/>
  <text x="620" y="248" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#58a6ff" text-anchor="middle">GATE</text>
  <text x="620" y="272" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8b949e" text-anchor="middle">input-controlled?</text>
  <text x="620" y="290" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8b949e" text-anchor="middle">reachable?</text>
  <text x="620" y="308" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8b949e" text-anchor="middle">exploitable here?</text>

  <path d="M 700 220 L 760 120" fill="none" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 700 260 L 760 260" fill="none" stroke="#d29922" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 700 300 L 760 400" fill="none" stroke="#f85149" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="770" y="76" width="390" height="88" rx="8" fill="#0d2818" stroke="#3fb950" stroke-width="1.5"/>
  <text x="794" y="108" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#3fb950">HIGH</text>
  <text x="794" y="132" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#c9d1d9">pattern + attacker-controlled input + reachable</text>
  <text x="794" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8b949e">-&gt; full report, CVSS vector, diff, verify step</text>

  <rect x="770" y="216" width="390" height="88" rx="8" fill="#2b2000" stroke="#d29922" stroke-width="1.5"/>
  <text x="794" y="248" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#d29922">MEDIUM</text>
  <text x="794" y="272" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#c9d1d9">pattern found, input source or context unclear</text>
  <text x="794" y="290" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8b949e">-&gt; report with the caveat stated, not buried</text>

  <rect x="770" y="356" width="390" height="88" rx="8" fill="#1a1113" stroke="#f85149" stroke-width="1.5"/>
  <text x="794" y="388" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#f85149">LOW</text>
  <text x="794" y="412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#c9d1d9">theoretical, or best practice with no exploit path</text>
  <text x="794" y="430" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8b949e">-&gt; notes only. never a finding, never a ticket.</text>

  <rect x="40" y="456" width="1120" height="40" rx="8" fill="#0f1620" stroke="#263140" stroke-width="1"/>
  <text x="60" y="481" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8b949e">BLIND SPOTS is printed on every report, including clean ones — silence must never read as "safe".</text>
</svg>
